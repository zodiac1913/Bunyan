[package]
name = "bunyan"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
connection-string = "0.2"
dirs = "6"
futures-util = "0.3.34"
hex = "0.4.3"
getrandom = "0.4"
keyring = "4.2"
maud = { version = "0.27.0", features = ["axum"] }
open = "5.4.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "chrono", "rustls"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
tempfile = "3"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
